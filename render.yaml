databases:
  - name: sem-hall-db
    plan: free
    databaseName: sem_hall_db
    user: sem_hall_user

services:
  - type: web
    name: sem-hall-mgt
    runtime: python
    plan: free

    buildCommand: bash build.sh

    startCommand: python -m gunicorn sem_hall_mgt.asgi:application -k uvicorn.workers.UvicornWorker

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sem-hall-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: RENDER
        value: "true"

      - key: WEB_CONCURRENCY
        value: "2"

      - key: PYTHON_VERSION
        value: "3.11.9"
